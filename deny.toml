# cargo-deny configuration
# Spec: black-october-security-hardening, task 13 (supply-chain gates).
# CI runs `cargo deny check advisories bans licenses sources` against this file
# on every PR; `cargo audit` is the documented local complement (see README).
# Validate locally with: cargo install cargo-deny && cargo deny check

[graph]
# The tray feature is Windows-only and never built by CI or the Linux docker
# image used by the cargo-deny action; keep the checked graph deterministic.
all-features = false
no-default-features = false

[advisories]
# Config schema v2 (cargo-deny >= 0.18). In v2 the `vulnerability`, `unsound`,
# `notice` and `severity-threshold` fields are removed: every vulnerability and
# unsound advisory now errors unless listed in `ignore` below.
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]
# When an advisory cannot be fixed immediately, add an entry with a reason so
# the decision is explicit and reviewable:
#   { id = "RUSTSEC-0000-0000", reason = "..." }
ignore = [
# paste 1.0.15 (RUSTSEC-2024-0436): archived upstream, no fixed release exists.
# Pulled only by tokenizers 0.23 via macro_rules_attribute (build-time proc
# macro); never executes at runtime. Revisit when tokenizers drops the dep.
{ id = "RUSTSEC-2024-0436", reason = "paste is a build-time proc-macro via tokenizers/macro_rules_attribute; upstream archived, no fixed release, no runtime exposure" },
# rustls-pemfile 2.2.0 (RUSTSEC-2025-0134): repo archived Aug 2025; the crate
# is a thin wrapper over rustls-pki-types PEM parsing (which we also use).
# Pulled by axum-server 0.7 (TLS acceptor) and tonic 0.12 via qdrant-client.
# Revisit when axum-server/tonic migrate to rustls-pki-types PemObject.
{ id = "RUSTSEC-2025-0134", reason = "rustls-pemfile archived upstream, thin wrapper over rustls-pki-types which stays current; transitive via axum-server/tonic, no fixed release available" },
# unsafe-libyaml 0.2.11 (RUSTSEC-2024-0449): maintenance moved into serde_yaml
# upstream (libyaml-safer project). serde_yaml 0.9 itself is deprecated but is
# our YAML config parser; migrating to serde_yaml_ng or serde-nihilist-
# remnant is a deliberate follow-up, not an emergency.
{ id = "RUSTSEC-2024-0449", reason = "serde_yaml (our YAML config parser) depends on unsafe-libyaml; no fixed release within serde_yaml 0.9, migration to a maintained YAML crate tracked separately" },
# quick-xml 0.39.4 (RUSTSEC-2026-0194/-0195): quadratic attribute-check and
# NsReader namespace-allocation DoS, patched in >=0.41. Our quick-xml comes
# only from wayland-scanner 0.31.9 (cap ^0.39) under winit 0.30 — a
# build-time protocol-code generator for the optional Windows-only `tray`
# feature. It never parses untrusted XML at runtime: the advisory's attack
# path (crafted XML fed to attributes()/NsReader) is unreachable. The deny
# graph includes lockfile target deps regardless of platform. Revisit when
# winit/wayland-scanner move to quick-xml >=0.41.
{ id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 reachable only via wayland-scanner build-time codegen under optional Windows tray feature; never parses untrusted XML at runtime; upstream cap ^0.39, patched in 0.41" },
{ id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 reachable only via wayland-scanner build-time codegen under optional Windows tray feature; never parses untrusted XML at runtime; upstream cap ^0.39, patched in 0.41" },
# ttf-parser 0.25.1 (RUSTSEC-2026-0192): crate unmaintained upstream. Pulled
# by ab_glyph/sctk-adwaita under winit 0.30 for the optional Windows-only
# `tray` feature (adwaita CSD decorations on Linux; on Windows winit uses
# the Win32 backend and this path is dead code in the shipped binary).
{ id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; only reachable via winit sctk-adwaita decorations for the optional tray feature; dead code in the Windows build; no fixed release exists" },
]
yanked = "deny"
unmaintained = "all"
# The windows ignore above only matches on Windows targets; the Linux CI graph
# never compiles it, so do not fail/warn when the ignore is "unused" there.
unused-ignored-advisory = "allow"

[licenses]
# Allowlist derived from the current Cargo.lock license set (verified against
# `cargo metadata` on 2026-10-23). Adding a dependency under a new license
# requires an explicit decision here, which is the point of the gate.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "LGPL-2.1-or-later",
    "BSL-1.0",
    # aws-lc-sys: "ISC AND (Apache-2.0 OR ISC) AND OpenSSL" — AND expressions
    # require every component to be allowed.
    "OpenSSL",
]
confidence-threshold = 0.95
unused-allowed-license = "warn"

# The workspace crate has no `license` field in its manifest; clarify that the
# repository's root MIT LICENSE applies (path is relative to the manifest dir).
[[licenses.clarify]]
crate = "ai-gateway"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0xb464ae6f }]

[bans]
# Tolerant: duplicate versions are common in a graph this size (base64, syn,
# getrandom, rustls, ...). Tightening this is a deliberate follow-up, not a
# default.
multiple-versions = "allow"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io (default registry) may supply dependencies; anything else
# (vendored git forks, alternative registries) must be an explicit decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
]
allow-git = []

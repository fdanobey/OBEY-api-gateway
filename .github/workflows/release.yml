name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (version bump)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cut-release:
    name: Cut release (bump, tag, merge to master)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Guard branch
        if: github.ref != 'refs/heads/development'
        run: |
          echo "::error::Release can only be cut from the development branch"
          exit 1

      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Compute next version
        id: version
        shell: pwsh
        run: |
          $manifest = "crates/ai-gateway/Cargo.toml"
          $current = (Select-String -Path $manifest -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $parts = $current -split '\.'
          switch ("${{ inputs.release_type }}") {
            "major" { $parts[0] = [int]$parts[0] + 1; $parts[1] = "0"; $parts[2] = "0" }
            "minor" { $parts[1] = [int]$parts[1] + 1; $parts[2] = "0" }
            default { $parts[2] = [int]$parts[2] + 1 }
          }
          $next = $parts -join '.'
          "current=$current" >> $env:GITHUB_OUTPUT
          "next=$next" >> $env:GITHUB_OUTPUT
          "tag=v$next" >> $env:GITHUB_OUTPUT

      - name: Bump version, commit, push release branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $manifest = "crates/ai-gateway/Cargo.toml"
          $next = "${{ steps.version.outputs.next }}"

          (Get-Content $manifest -Raw) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$next`"" |
            Set-Content $manifest -NoNewline

          # Update the ai-gateway package stanza in Cargo.lock (same edit the
          # manual release branches made; avoids a full cargo update in docker).
          $lock = Get-Content Cargo.lock -Raw
          $lock = $lock -replace ('(?ms)(name = "ai-gateway"\r?\nversion = ")[^"]+'), "`${1}$next"
          Set-Content Cargo.lock $lock -NoNewline

          git add $manifest Cargo.lock
          git commit -m "chore: bump version to $next"
          # release/* branches are unprotected; clear any stale branch from a
          # previous failed attempt before pushing the fresh one.
          git push origin --delete "refs/heads/release/v$next" 2>$null
          git push origin "HEAD:refs/heads/release/v$next"

      - name: Open release PR and enable auto-merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "release/v${{ steps.version.outputs.next }}"
          gh pr create --base development --head $branch `
            --title "chore(release): v${{ steps.version.outputs.next }}" `
            --body "Version bump to ${{ steps.version.outputs.next }}. Auto-generated by the Release workflow."
          # Auto-merge: GitHub merges the PR itself once required checks pass.
          gh pr merge $branch --merge --auto

      - name: Wait for release PR to merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "release/v${{ steps.version.outputs.next }}"
          $deadline = (Get-Date).AddMinutes(30)
          do {
            $pr = gh pr view $branch --json state,mergeStateStatus | ConvertFrom-Json
            if ($pr.state -eq "MERGED") { break }
            if ($pr.state -eq "CLOSED") { throw "Release PR was closed without merging" }
            Start-Sleep -Seconds 30
            if ((Get-Date) -gt $deadline) { throw "Timed out waiting for release PR to merge" }
          } until ($pr.state -eq "MERGED")

      - name: Wait for checks on the merge commit, then fast-forward master
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin development master
          $expected = git rev-parse refs/remotes/origin/development
          $deadline = (Get-Date).AddMinutes(30)
          do {
            # Combined status/check-runs for the exact merge SHA
            $checkRuns = gh api "repos/fdanobey/OBEY-api-gateway/commits/$expected/check-runs" `
              --jq '.check_runs | length' 2>$null
            if ([int]$checkRuns -gt 0) {
              $passing = gh api "repos/fdanobey/OBEY-api-gateway/commits/$expected/check-runs" `
                --jq '[.check_runs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length'
              if ([int]$passing -eq 0) {
                $succeeded = gh api "repos/fdanobey/OBEY-api-gateway/commits/$expected/check-runs" `
                  --jq '[.check_runs[] | select(.status == "completed" and .conclusion == "success")] | length'
                if ([int]$succeeded -gt 0) { break }
              }
            }
            Start-Sleep -Seconds 30
            if ((Get-Date) -gt $deadline) { throw "Timed out waiting for merge-commit checks (expected $expected)" }
          } until ($false)
          git push origin "refs/remotes/origin/development:refs/heads/master"

      - name: Tag the release commit
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $sha = git rev-parse refs/remotes/origin/development
          git tag -a $tag -m "Release $tag" $sha
          git push origin $tag

  build-windows:
    name: Build & publish release artifacts
    needs: cut-release
    if: >-
      always() && (
        needs.cut-release.result == 'success' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          fetch-depth: 0
          # On dispatch: check out the tag just created by cut-release.
          # On tag push: cut-release is skipped, so this falls back to the pushed tag.
          ref: ${{ needs.cut-release.outputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p ai-gateway --features tray

      - name: Package release
        shell: pwsh
        run: |
          $name = "ai-gateway"
          $bin  = "target/release/$name.exe"
          $out = "dist"

          New-Item -ItemType Directory -Path "$out/Assets" -Force | Out-Null

          Copy-Item $bin                                "$out/$name.exe"
          Copy-Item "crates/$name/README.md"            "$out/README.md"
          Copy-Item "crates/$name/config.example.yaml"  "$out/config.example.yaml"
          Copy-Item "crates/$name/config.example.yaml"  "$out/config.yaml"
          Copy-Item "Assets/icon.ico" "$out/Assets/icon.ico"
          Copy-Item "Assets/logo.jpg" "$out/Assets/logo.jpg"

          $hash = (Get-FileHash "$out/$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Set-Content "$out/SHA256SUMS.txt" -NoNewline

          Compress-Archive -Path "$out/*" -DestinationPath "$name-windows-x86_64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup 6 is pre-installed on windows-latest runners
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Warning "Inno Setup not found — skipping installer"
            exit 0
          }
          # The .iss expects artifacts in ./release, so copy from dist
          New-Item -ItemType Directory -Path "release/Assets" -Force | Out-Null
          Copy-Item "dist/*" "release/" -Recurse -Force
          & $iscc "scripts/installer.iss"

      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          # Source of truth is git history, NOT the tag annotation.
          # actions/checkout replaces annotated tags with lightweight tags,
          # so the annotation is not reliable in CI. We rebuild notes here.
          $tag  = "${{ needs.cut-release.outputs.tag || github.ref_name }}"
          $repo = $env:GITHUB_REPOSITORY

          # Previous tag reachable from this tag's parent (linear history).
          $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prevTag) {
            $range   = $tag # first release: everything up to tag
            $prevTag = $null
          } else {
            $range = "$prevTag..$tag"
          }

          $commits = @(git log $range --pretty=format:"- %s" --no-merges |
            Where-Object { $_ -notmatch "^- chore: bump version" })

          $features = @($commits | Where-Object { $_ -match "^- feat" })
          $fixes    = @($commits | Where-Object { $_ -match "^- fix" })
          $other    = @($commits | Where-Object { $_ -notmatch "^- feat" -and $_ -notmatch "^- fix" })

          $lines = @("## What's Changed", "")
          if ($features) { $lines += "### Features"; $lines += $features; $lines += "" }
          if ($fixes)    { $lines += "### Fixes"; $lines += $fixes; $lines += "" }
          if ($other)    { $lines += "### Other"; $lines += $other; $lines += "" }
          if (-not ($features -or $fixes -or $other)) { $lines += "_No notable changes._"; $lines += "" }

          if ($prevTag) {
            $lines += "**Full Changelog**: https://github.com/$repo/compare/$prevTag...$tag"
          }

          $body = $lines -join "`n"
          Write-Host $body
          Set-Content -Path "release-notes.md" -Value $body -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.cut-release.outputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            ai-gateway-windows-x86_64.zip
            release/OBEY-API-Gateway-Setup-*.exe
            dist/SHA256SUMS.txt

name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & validate fallback catalogs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Check (compile all targets, deny warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check -p ai-gateway --all-targets

      - name: Validate NVIDIA NIM sync fixtures
        shell: pwsh
        run: ./scripts/sync-nvidia-nim-fallback.ps1 -ValidateFixtures

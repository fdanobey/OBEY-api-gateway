[workspace]
members = ["crates/ai-gateway"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.49", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.60.2", default-features = false }
serde_yaml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "stream", "form", "query"] }
aws-sdk-bedrockruntime = { version = "1.76", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-bedrock = { version = "1.145", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-config = { version = "1.5", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
# Pinned to the deployed Qdrant server minor (1.18.x): the client refuses a
# minor gap > 1 at startup ("Client version ... not compatible with server
# version ..."). Bump together with the Qdrant server.
qdrant-client = "=1.20.0"
rust-embed = { version = "8.5", features = ["compression"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dashmap = "6.1"
proptest = "1.5"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
tiktoken-rs = "0.12"
futures = "0.3"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
axum-server = { version = "0.8", features = ["tls-rustls"] }
wiremock = "0.6"
rcgen = "0.14"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.test]
# ai-gateway itself is ~8.5 MB of source: at opt-level 2 one rustc for its
# test harness needed ~8 GB and >12 min. opt-level 1 is the floor: at 0 the
# request-handler futures overflow the 2 MB test-thread stack. Dependencies
# (compiled once and cached) stay optimised below.
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
opt-level = 2
